name: Tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]
        laravel: ["^10.0", "^11.0", "^12.0", "^13.0"]
        include:
          - laravel: "^10.0"
            testbench: "^8.0"
          - laravel: "^11.0"
            testbench: "^9.0"
          - laravel: "^12.0"
            testbench: "^10.0"
          - laravel: "^13.0"
            testbench: "^11.0"
        exclude:
          - laravel: "^10.0"
            php: "8.4"
          - laravel: "^10.0"
            php: "8.5"
          - laravel: "^11.0"
            php: "8.1"
          - laravel: "^11.0"
            php: "8.5"
          - laravel: "^12.0"
            php: "8.1"
          - laravel: "^13.0"
            php: "8.1"
          - laravel: "^13.0"
            php: "8.2"
    name: Laravel ${{ matrix.laravel }} PHP${{ matrix.php }} on ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate composer files
        run: composer validate
      - name: Install dependencies
        run: |
          # Laravel 10/11 stable releases carry advisories; Composer 2.9+ would otherwise resolve them to x-dev.
          composer config audit.block-insecure false || true
          composer require "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress
      - name: Run tests
        run: vendor/bin/phpunit
